sanitizer:
  adapter: python_function   # python_function | rest | cli
  # python_function: module + callable path, e.g. "my_pkg.sanitizer:sanitize"
  # rest: url, auth header env var, request/response field names
  # cli: command template, stdin/stdout format
  epsilons: [0.05, 0.1, 0.2, 0.5, 1, 2]   # sweep values (CONFIG; replace with the sanitizer's real parameter range)
  draws_per_prompt: 3           # k
  ablations: [all, names_only, age_only, money_only]
llm:
  generator_model: "gpt-oss-120b"     # model used to answer prompts (A, A', B)
  generator_temperature: 0.7
  judge_model: "claude-sonnet-5-5"         # MUST be a different model family from generator_model
  judge_temperature: 0
  dataset_gen_model: "claude-sonnet-5-5"   # model used to help write templates / paraphrases
dataset:
  n_prompts: 350
  seed: 1234
  currencies: [USD, CAD, EUR, JPY, GBP]
paths:
  data_dir: data/
  runs_dir: runs/
  reports_dir: reports/