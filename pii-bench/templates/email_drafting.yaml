templates:
- id: email_drafting-000
  task_family: email_drafting
  task_type: drafting
  pii_dependency: incidental
  verifiable: false
  text: Can you help me write a short, polite email from {NAME} to a client following
    up on an unpaid invoice for {MONEY}? It's been about three weeks past the due
    date, so I want it to be firm but still friendly.
  slots:
  - NAME
  - MONEY
  notes: invoice follow-up, firm but friendly tone
- id: email_drafting-001
  task_family: email_drafting
  task_type: drafting
  pii_dependency: incidental
  verifiable: false
  text: I need to email my manager asking for a raise, and I'd like to ask for {MONEY}
    more per year. Could you draft something concise and confident that I can send
    under the name {NAME}?
  slots:
  - NAME
  - MONEY
  notes: salary negotiation, confident tone
- id: email_drafting-002
  task_family: email_drafting
  task_type: drafting
  pii_dependency: incidental
  verifiable: false
  text: Please draft a brief email from {NAME} to the finance team requesting a budget
    of {MONEY} for a team offsite next quarter. Keep it professional and include a
    quick line about why it's worth the investment.
  slots:
  - NAME
  - MONEY
  notes: budget request, professional and justifying tone
