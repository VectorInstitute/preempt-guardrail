templates:
- id: retirement_eligibility-000
  task_family: retirement_eligibility
  task_type: eligibility
  pii_dependency: semantic
  verifiable: true
  text: 'My coworker {NAME} is {AGE} years old and wants to start pulling money out
    of a traditional IRA. Under the standard IRS rules, can {NAME} do that without
    paying the 10% early-withdrawal penalty? End your answer with a line: FINAL_ANSWER:
    <ELIGIBLE or NOT_ELIGIBLE>.'
  slots:
  - NAME
  - AGE
  notes: traditional IRA, coworker framing, penalty-free withdrawal
- id: retirement_eligibility-001
  task_family: retirement_eligibility
  task_type: eligibility
  pii_dependency: semantic
  verifiable: true
  text: 'I''m helping my neighbor sort out finances. {NAME} just turned {AGE} and
    has a 401(k) from a previous employer that is still open, and {NAME} is still
    working elsewhere. Is it possible to take a distribution now with no early-withdrawal
    penalty, assuming no special exceptions apply? End your answer with a line: FINAL_ANSWER:
    <ELIGIBLE or NOT_ELIGIBLE>.'
  slots:
  - NAME
  - AGE
  notes: old 401(k), neighbor framing, no exceptions assumed
- id: retirement_eligibility-002
  task_family: retirement_eligibility
  task_type: eligibility
  pii_dependency: semantic
  verifiable: true
  text: 'Quick question about catch-up contributions: {NAME} is {AGE} years old and
    wants to make extra catch-up contributions to a workplace 401(k) this year. Does
    {NAME} meet the age requirement for catch-up contributions? End your answer with
    a line: FINAL_ANSWER: <ELIGIBLE or NOT_ELIGIBLE>.'
  slots:
  - NAME
  - AGE
  notes: catch-up contribution age question instead of withdrawal
