[project]
name = "preempt-guardrail"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [ {name = "Vector AI Engineering", email = "ai_engineering@vectorinstitute.ai"}]
license = "Apache-2.0"
repository = "https://github.com/VectorInstitute/preempt-guardrail"
requires-python = ">=3.12"
dependencies = [
    "filelock==4.0.5",
    "requests>=2.33.0", # Pinning version to address vulnerability CVE-2026-25645
    "urllib3==2.8.0",
    "pygments>=2.20.0", # Pinning version to address vulnerability CVE-2026-4539
    "onnxruntime>=1.30.0",
    "optimum[onnxruntime]>=2.1.0",
    # Direct pin so uv uses the git revision below instead of PyPI 0.1.0.
    "optimum-onnx[onnxruntime]",
    "transformers>=5.18.0",
    "onnx>=1.23.2",
    "pydantic>=2.7",
    "json-repair>=0.64.1",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preempt"]

[dependency-groups]
dev = [
    "codecov>=2.1.13",
    "mypy>=1.20.1",
    "nbqa>=1.9.1",
    "pip>=26.1", # Pinning version to address vulnerabilities CVE-2026-1703, CVE-2026-3219
    "pip-audit>=2.7.3",
    "pre-commit>=4.1.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "msgpack>=1.2.1", # Pinning version to address vulnerability GHSA-6v7p-g79w-8964
    "ruff>=0.13.3",
]
docs = [
    "jinja2>=3.1.6", # Pinning version to address vulnerability GHSA-cpwx-vrp4-4pq7
    "pygments>=2.20.0", # Pinning version to address vulnerability CVE-2026-4539
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.15",
    "pymdown-extensions>=10.21.2", # Pinning version to fix pygments 2.20.0 compatibility
    "mkdocstrings>=1.0.4",
    "mkdocstrings-python>=1.10.0",
    "ipykernel>=6.29.5",
    "ipython>=8.31.0",
    "tornado>=6.5.6", # Pinning version to address vulnerability CVE-2026-49854
]

train = [
    "accelerate>=1.1.0",
    "datasets>=3.2.0",
    "names>=0.3.0",
    "names-dataset>=3.3.1",
    "protobuf>=5.29.4",
    "pyfpe>=0.10.3",
    "sentencepiece>=0.2.0",
    "torch>=2.6.0",
    "tqdm>=4.67.1",
    "transformers>=4.51.3",
]

# Default dependency groups to be installed
[tool.uv]
default-groups = ["dev", "docs"]
# optimum-onnx 0.1.0 rejects transformers>=4.58. The pinned revision imports
# under transformers 5, so keep the project pin and ignore that upper bound.
override-dependencies = ["transformers>=5.18.0"]

[tool.uv.sources]
optimum-onnx = { git = "https://github.com/huggingface/optimum-onnx.git", rev = "46533fb66570021f52a39d77112b703762fdaada" }

[tool.mypy]
follow_imports = "normal"
ignore_missing_imports = false
install_types = true
pretty = true
non_interactive = true
allow_untyped_defs = false
no_implicit_optional = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
allow_subclassing_any = false
allow_untyped_calls = false
allow_incomplete_defs = false
allow_untyped_decorators = false
warn_redundant_casts = true
warn_unused_ignores = true
implicit_reexport = false
strict_equality = true
extra_checks = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "datasets",
    "datasets.*",
    "optimum",
    "optimum.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    "tqdm",
    "tqdm.*",
]
ignore_missing_imports = true

# The sanitizer and its name-list helpers predate the strict checker.
[[tool.mypy.overrides]]
module = ["preempt.sanitizer", "preempt.utils"]
ignore_errors = true

[tool.ruff]
include = ["*.py", "pyproject.toml", "*.ipynb"]
exclude = []
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "COM", # flake8-commas
    "C4", # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ICN", # flake8-import-conventions
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "W", # pycodestyle
    "N", # pep8-naming
    "ERA", # eradicate
    "PL", # pylint
]
fixable = ["A", "B", "COM", "C4", "RET", "SIM", "ICN", "Q", "RSE", "D", "E", "F", "I", "W", "N", "ERA", "PL"]
ignore = [
    "B905", # `zip()` without an explicit `strict=` parameter
    "E501", # line too long
    "D203", # 1 blank line required before class docstring
    "D213", # Multi-line docstring summary should start at the second line
    "PLR2004", # Replace magic number with named constant
    "PLR0913", # Too many arguments
    "COM812", # Missing trailing comma
    "ERA001", # Found commented-out code (too many false positives with math comments)
    "A001", # Ignore variable `input` is shadowing a Python builtin (common for torch)
    "A002", # Ignore variable `input` is shadowing a Python builtin in function (common for torch)
    "D301", # r-strings for docstrings with backslashes
]

# Ignore import violations in all `__init__.py` files.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]
# Ignoring undocumented public functions, public init, magic method, and magic numbers in tests folder
"tests/*" = ["D103", "D105", "D107"]


[tool.ruff.lint.pep8-naming]
ignore-names = ["X*", "setUp"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.pytest.ini_options]
markers = [
    "integration_test: marks tests as integration tests",
]

[tool.coverage]
    [tool.coverage.run]
    source=["src/preempt"]
    omit=["tests/*", "*__init__.py"]
